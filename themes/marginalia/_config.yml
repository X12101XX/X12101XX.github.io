  - name: 首页
    path: /
  - name: 文章
    path: /posts/
  - name: 归档
    path: /archives/
  - name: 分类
    path: /categories/
  - name: 标签
    path: /tags/
  - name: 友链
    path: /friends/
  - name: 关于
    path: /about/

social:
  - name: GitHub
    icon: github
    url: https://github.com/X12101XX
  - name: RSS
    icon: rss
    url: /atom.xml

landing:
  name: X12101XX
