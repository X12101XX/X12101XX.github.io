# Marginalia — Modern Aurora & Glassmorphism theme for Hexo.
# Site-specific settings live in _config.marginalia.yml at the project root.

toc:
  enable: true
  min_depth: 2
  max_depth: 3

search:
  enable: true
  path: /search.xml

reading:
  speed: 400

footer:
  since: 2026
  note: 缓慢地写，诚实地写

author:
  name: X12101XX
  avatar: /images/avatar.jpg
  github: https://github.com/X12101XX

